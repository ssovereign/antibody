# Render blueprint: the ANTIBODY server (with the web app) on one service with a persistent disk.
# Render → New → Blueprint → pick this repository. Then add ANTHROPIC_API_KEY under Environment.
services:
  - type: web
    name: antibody
    runtime: docker
    plan: starter
    healthCheckPath: /v1/health
    disk:
      name: antibody-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PROJECT_AUTH_MODE
        value: token
      # behind Render's proxy with token sign-in, any host name is fine (the host check protects local installs)
      - key: EXTRA_ALLOWED_HOSTS
        value: "*"
      # your Vercel site's address, once you have it (only needed if the website is hosted on Vercel)
      - key: EXTRA_UI_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # only for an organization-level key: the workspace it should bill (wrkspc_...)
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      # accounts: the service's public address, and a GitHub OAuth app whose callback is PUBLIC_URL/v1/auth/github/callback
      - key: PUBLIC_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Claude calls each user may make per day on the shared key
      - key: CLAUDE_DAILY_CALLS_PER_PROJECT
        value: "300"
